<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Digital & Latar Video</title>
    <!-- Menggunakan Tailwind CSS untuk tata letak dan desain modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Menggunakan Font Google: Plus Jakarta Sans & JetBrains Mono untuk angka jam -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent-color: #38bdf8; /* Warna aksen default (Sky Blue) */
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #090d16;
            color: #ffffff;
            user-select: none;
        }

        .font-mono-clock {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Kontainer Video Background Fullscreen */
        .video-background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background-color: #090d16;
        }

        /* Trik agar iframe YouTube selalu memenuhi layar (cover) tanpa black bars */
        .video-background-container iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* Rasio 16:9 */
            min-height: 100vh;
            min-width: 177.77vh; /* Rasio 16:9 */
            transform: translate(-50%, -50%) scale(1.03);
            border: none;
        }

        /* Video HTML5 Lokal / URL Langsung */
        .video-background-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Efek Kaca (Glassmorphism) */
        .glass-card {
            background: rgba(15, 23, 42, 0.52);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Animasi kedip titik dua jam */
        @keyframes pulse-colon {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .colon-blink {
            animation: pulse-colon 1s infinite ease-in-out;
        }

        /* Custom Scrollbar untuk panel pengaturan */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="relative w-screen h-screen flex items-center justify-center">

    <!-- 1. LATAR BELAKANG VIDEO (YOUTUBE & VIDEO LOKAL/MP4) -->
    <div class="video-background-container" id="videoContainer">
        <!-- Player YouTube -->
        <div id="ytPlayerWrapper" class="w-full h-full">
            <div id="ytPlayer"></div>
        </div>
        <!-- Player Video Lokal / MP4 -->
        <video id="localVideoPlayer" class="hidden" autoplay loop muted playsinline></video>
    </div>

    <!-- Overlay Gelap agar teks jam tetap kontras & mudah dibaca -->
    <div id="videoOverlay" class="fixed inset-0 bg-slate-950/45 z-10 transition-opacity duration-300"></div>

    <!-- Notifikasi Toast (Pengganti alert) -->
    <div id="toastNotification" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full glass-card text-sm font-medium text-white shadow-xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="toastMessage">Pengaturan disimpan!</span>
    </div>

    <!-- 2. TAMPILAN UTAMA: PROFIL & JAM DIGITAL -->
    <main class="relative z-20 px-4 w-full max-w-4xl flex flex-col items-center justify-center">
        <div id="clockCard" class="glass-card rounded-3xl p-8 md:p-12 w-full text-center transition-all duration-500 flex flex-col items-center">
            
            <!-- Bagian Logo Profil & Nama Brand/Channel -->
            <div class="flex flex-col items-center mb-6 group">
                <div class="relative cursor-pointer" onclick="toggleSettings(true)" title="Klik untuk mengganti logo profil">
                    <div id="profileRing" class="w-24 h-24 md:w-28 md:h-28 rounded-full p-1 transition-all duration-300 shadow-lg" style="background: linear-gradient(135deg, var(--accent-color), #818cf8);">
                        <img 
                            id="profileLogoImg" 
                            src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=256&q=80" 
                            onerror="this.src='https://placehold.co/256x256/0f172a/38bdf8?text=LOGO'"
                            alt="Logo Profil" 
                            class="w-full h-full object-cover rounded-full bg-slate-900"
                        >
                    </div>
                    <!-- Ikon Kamera Kecil saat di-hover -->
                    <div class="absolute bottom-0 right-0 bg-slate-900/90 border border-white/20 p-2 rounded-full text-white shadow-md opacity-85 group-hover:opacity-100 group-hover:scale-110 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                </div>

                <!-- Nama Profil / Judul -->
                <h1 id="profileNameDisplay" class="mt-4 text-xl md:text-2xl font-bold tracking-wide text-white drop-shadow">
                    STUDIO LIVE DIGITAL
                </h1>
                <p id="profileSubtitleDisplay" class="text-xs md:text-sm text-slate-300/90 mt-0.5 font-medium">
                    Selamat Datang & Selamat Beraktivitas
                </p>
            </div>

            <!-- Garis Pemisah Halus -->
            <div class="w-24 h-1 rounded-full mb-6 opacity-70" style="background-color: var(--accent-color);"></div>

            <!-- Jam Digital Utama -->
            <div class="font-mono-clock flex items-baseline justify-center tracking-tight leading-none select-none">
                <span id="clockHours" class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-extrabold text-white drop-shadow-lg">00</span>
                <span class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-bold mx-1 md:mx-2 colon-blink" style="color: var(--accent-color);">:</span>
                <span id="clockMinutes" class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-extrabold text-white drop-shadow-lg">00</span>
                <div class="flex flex-col items-start ml-2 md:ml-4">
                    <span id="clockSeconds" class="text-2xl sm:text-3xl md:text-4xl font-bold drop-shadow" style="color: var(--accent-color);">00</span>
                    <span id="clockPeriod" class="text-xs md:text-sm font-semibold uppercase tracking-widest text-slate-300 mt-1">WIB</span>
                </div>
            </div>

            <!-- Tanggal Lengkap Bahasa Indonesia -->
            <div class="mt-6 inline-flex items-center gap-2.5 px-5 py-2 rounded-full bg-white/10 border border-white/10 text-sm md:text-lg font-medium text-slate-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 opacity-80" style="color: var(--accent-color);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span id="dateDisplay">Memuat tanggal...</span>
            </div>

        </div>
    </main>

    <!-- 3. TOMBOL KONTROL CEPAT DI POJOK KANAN BAWAH -->
    <div class="fixed bottom-6 right-6 z-30 flex items-center gap-3">
        <!-- Tombol Mute / Unmute Video -->
        <button 
            id="muteToggleBtn" 
            onclick="toggleVideoMute()" 
            class="glass-card p-3.5 rounded-full text-white hover:bg-white/20 transition-all shadow-lg flex items-center gap-2"
            title="Suara Video (Mute/Unmute)"
        >
            <!-- Ikon Muted (Default) -->
            <svg id="iconMuted" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
            <!-- Ikon Unmuted -->
            <svg id="iconUnmuted" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-emerald-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
        </button>

        <!-- Tombol Fullscreen Layar -->
        <button 
            onclick="toggleFullscreen()" 
            class="glass-card p-3.5 rounded-full text-white hover:bg-white/20 transition-all shadow-lg"
            title="Layar Penuh (Fullscreen)"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
        </button>

        <!-- Tombol Buka Panel Pengaturan -->
        <button 
            onclick="toggleSettings(true)" 
            class="glass-card px-4 py-3.5 rounded-full text-white hover:bg-white/20 transition-all shadow-lg flex items-center gap-2 font-medium text-sm"
            title="Pengaturan Jam, Video & Profil"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" style="color: var(--accent-color);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="hidden sm:inline">Pengaturan</span>
        </button>
    </div>

    <!-- 4. DRAWER / PANEL PENGATURAN (TERSEMBUNYI SECARA DEFAULT) -->
    <aside id="settingsDrawer" class="fixed top-0 right-0 h-full w-full sm:w-96 glass-panel z-40 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
        <!-- Header Panel -->
        <div class="p-6 border-b border-white/10 flex items-center justify-between">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <span>Pengaturan Tampilan</span>
            </h2>
            <button onclick="toggleSettings(false)" class="p-2 rounded-lg hover:bg-white/10 text-slate-300 hover:text-white transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Isi Form Pengaturan -->
        <div class="p-6 overflow-y-auto flex-1 space-y-6 text-sm">
            
            <!-- Bagian A: Sumber Video Latar Belakang -->
            <div class="space-y-3">
                <label class="block font-semibold text-slate-200">1. Video Latar Belakang</label>
                <p class="text-xs text-slate-400">Masukkan tautan YouTube / URL file MP4, atau unggah video langsung dari perangkat Anda.</p>
                
                <!-- Input Link YouTube atau URL Video Langsung -->
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="videoUrlInput" 
                        placeholder="Link YouTube atau URL .mp4..." 
                        class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-white/15 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-xs"
                    >
                    <button 
                        onclick="applyVideoLink()" 
                        class="px-4 py-2.5 rounded-xl font-semibold text-slate-950 transition hover:opacity-90 shrink-0"
                        style="background-color: var(--accent-color);"
                    >
                        Putar
                    </button>
                </div>

                <!-- Unggah File Video Lokal (MP4/WebM) -->
                <div>
                    <label class="flex items-center justify-center w-full px-4 py-2.5 border border-dashed border-white/25 rounded-xl cursor-pointer hover:bg-white/5 transition gap-2 text-slate-300 text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" style="color: var(--accent-color);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        <span>Pilih File Video dari Perangkat (MP4 / WebM)</span>
                        <input type="file" id="videoFileInput" accept="video/*" class="hidden" onchange="handleLocalVideoUpload(event)">
                    </label>
                </div>

                <!-- Preset Video Cepat -->
                <div class="flex flex-wrap gap-1.5 pt-1">
                    <button onclick="setPresetYoutubeVideo('jfKfPfyJRdk')" class="text-[11px] px-2.5 py-1 rounded-md bg-white/10 hover:bg-white/20 text-slate-300 transition">Lofi Girl</button>
                    <button onclick="setPresetYoutubeVideo('LXb3EKWsInQ')" class="text-[11px] px-2.5 py-1 rounded-md bg-white/10 hover:bg-white/20 text-slate-300 transition">Alam 4K</button>
                    <button onclick="setPresetYoutubeVideo('5qap5aO4i9A')" class="text-[11px] px-2.5 py-1 rounded-md bg-white/10 hover:bg-white/20 text-slate-300 transition">Pemandangan Kota</button>
                </div>
            </div>

            <hr class="border-white/10">

            <!-- Bagian B: Ganti Logo Profil -->
            <div class="space-y-3">
                <label class="block font-semibold text-slate-200">2. Logo Profil</label>
                
                <!-- Unggah File Gambar -->
                <div>
                    <label class="flex items-center justify-center w-full px-4 py-3 border border-dashed border-white/25 rounded-xl cursor-pointer hover:bg-white/5 transition gap-2 text-slate-300 text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" style="color: var(--accent-color);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        <span>Unggah Gambar Logo dari Perangkat</span>
                        <input type="file" id="logoFileInput" accept="image/*" class="hidden" onchange="handleLogoUpload(event)">
                    </label>
                </div>

                <!-- Atau Gunakan URL Gambar -->
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="logoUrlInput" 
                        placeholder="Atau tempel URL gambar logo..." 
                        class="w-full px-3.5 py-2 rounded-xl bg-slate-900/90 border border-white/15 text-white placeholder-slate-500 focus:outline-none focus:border-sky-400 text-xs"
                    >
                    <button 
                        onclick="applyLogoUrl()" 
                        class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white font-medium text-xs shrink-0 transition"
                    >
                        Ganti
                    </button>
                </div>

                <!-- Bentuk Logo -->
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-slate-300">Bentuk Bingkai Logo:</span>
                    <div class="flex gap-2">
                        <button onclick="setLogoShape('rounded-full')" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs">Bulat</button>
                        <button onclick="setLogoShape('rounded-2xl')" class="px-3 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-xs">Kotak</button>
                    </div>
                </div>
            </div>

            <hr class="border-white/10">

            <!-- Bagian C: Teks Nama & Subjudul -->
            <div class="space-y-3">
                <label class="block font-semibold text-slate-200">3. Identitas & Teks</label>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nama Brand / Profil</label>
                    <input 
                        type="text" 
                        id="profileNameInput" 
                        value="STUDIO LIVE DIGITAL"
                        oninput="updateProfileText()"
                        class="w-full px-3.5 py-2 rounded-xl bg-slate-900/90 border border-white/15 text-white focus:outline-none focus:border-sky-400 text-xs"
                    >
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Keterangan / Slogan</label>
                    <input 
                        type="text" 
                        id="profileSubtitleInput" 
                        value="Selamat Datang & Selamat Beraktivitas"
                        oninput="updateProfileText()"
                        class="w-full px-3.5 py-2 rounded-xl bg-slate-900/90 border border-white/15 text-white focus:outline-none focus:border-sky-400 text-xs"
                    >
                </div>
            </div>

            <hr class="border-white/10">

            <!-- Bagian D: Kustomisasi Visual -->
            <div class="space-y-3">
                <label class="block font-semibold text-slate-200">4. Warna Aksen & Kegelapan Video</label>
                
                <!-- Pilihan Warna Aksen -->
                <div class="flex items-center justify-between">
                    <span class="text-xs text-slate-300">Warna Aksen Jam:</span>
                    <div class="flex gap-2">
                        <button onclick="setAccentColor('#38bdf8')" class="w-6 h-6 rounded-full bg-sky-400 border border-white/40 hover:scale-110 transition"></button>
                        <button onclick="setAccentColor('#34d399')" class="w-6 h-6 rounded-full bg-emerald-400 border border-white/40 hover:scale-110 transition"></button>
                        <button onclick="setAccentColor('#fbbf24')" class="w-6 h-6 rounded-full bg-amber-400 border border-white/40 hover:scale-110 transition"></button>
                        <button onclick="setAccentColor('#f472b6')" class="w-6 h-6 rounded-full bg-pink-400 border border-white/40 hover:scale-110 transition"></button>
                        <button onclick="setAccentColor('#a78bfa')" class="w-6 h-6 rounded-full bg-violet-400 border border-white/40 hover:scale-110 transition"></button>
                    </div>
                </div>

                <!-- Slider Kegelapan Overlay -->
                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-slate-300">
                        <span>Kegelapan Latar Video</span>
                        <span id="overlayValueLabel">45%</span>
                    </div>
                    <input 
                        type="range" 
                        id="overlayOpacitySlider" 
                        min="0" 
                        max="85" 
                        value="45" 
                        oninput="updateOverlayOpacity(this.value)"
                        class="w-full accent-sky-400 cursor-pointer"
                    >
                </div>
            </div>

        </div>

        <!-- Footer Panel: Reset -->
        <div class="p-4 border-t border-white/10 flex justify-between items-center bg-slate-950/50">
            <button onclick="resetSettings()" class="text-xs text-rose-400 hover:text-rose-300 font-medium transition">
                Reset ke Default
            </button>
            <button onclick="toggleSettings(false)" class="px-4 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold transition">
                Selesai
            </button>
        </div>
    </aside>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        /**
         * KONFIGURASI & STATE APLIKASI
         */
        const DEFAULT_SETTINGS = {
            videoType: 'youtube', // 'youtube' atau 'direct'
            videoSource: 'jfKfPfyJRdk', // ID YouTube atau URL langsung MP4
            logoUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=256&q=80',
            logoShape: 'rounded-full',
            profileName: 'STUDIO LIVE DIGITAL',
            profileSubtitle: 'Selamat Datang & Selamat Beraktivitas',
            accentColor: '#38bdf8',
            overlayOpacity: 45
        };

        let appSettings = { ...DEFAULT_SETTINGS };
        let player = null;
        let isPlayerReady = false;
        let isMuted = true;
        let currentLocalObjectUrl = null;

        /**
         * 1. INISIALISASI SAAT HALAMAN DIMUAT
         */
        window.addEventListener('DOMContentLoaded', () => {
            loadSettingsFromStorage();
            applySettingsToUI();
            startDigitalClock();
        });

        /**
         * 2. LOGIKA JAM DIGITAL REAL-TIME (BAHASA INDONESIA)
         */
        function startDigitalClock() {
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const namaBulan = [
                'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ];

            function updateTime() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                document.getElementById('clockHours').textContent = hours;
                document.getElementById('clockMinutes').textContent = minutes;
                document.getElementById('clockSeconds').textContent = seconds;

                const hari = namaHari[now.getDay()];
                const tanggal = now.getDate();
                const bulan = namaBulan[now.getMonth()];
                const tahun = now.getFullYear();

                document.getElementById('dateDisplay').textContent = `${hari}, ${tanggal} ${bulan} ${tahun}`;
            }

            updateTime();
            setInterval(updateTime, 1000);
        }

        /**
         * 3. INTEGRASI VIDEO (YOUTUBE & VIDEO LOKAL/MP4)
         */
        function onYouTubeIframeAPIReady() {
            const initialYtId = appSettings.videoType === 'youtube' ? appSettings.videoSource : DEFAULT_SETTINGS.videoSource;
            player = new YT.Player('ytPlayer', {
                videoId: initialYtId,
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    controls: 0,
                    showinfo: 0,
                    rel: 0,
                    loop: 1,
                    playlist: initialYtId,
                    modestbranding: 1,
                    playsinline: 1,
                    disablekb: 1
                },
                events: {
                    onReady: (event) => {
                        isPlayerReady = true;
                        event.target.mute();
                        if (appSettings.videoType === 'youtube') {
                            event.target.playVideo();
                        } else {
                            event.target.pauseVideo();
                        }
                    },
                    onStateChange: (event) => {
                        if (event.data === YT.PlayerState.ENDED && appSettings.videoType === 'youtube') {
                            player.playVideo();
                        }
                    }
                }
            });
        }

        /**
         * Ekstrak ID Video YouTube dari berbagai format link
         */
        function extractYouTubeId(url) {
            if (!url) return null;
            const trimmed = url.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
                return trimmed;
            }
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts|live)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = trimmed.match(regex);
            return match ? match[1] : null;
        }

        function applyVideoLink() {
            const inputUrl = document.getElementById('videoUrlInput').value.trim();
            if (!inputUrl) {
                showToast('Masukkan tautan YouTube atau URL video terlebih dahulu.', true);
                return;
            }

            const ytId = extractYouTubeId(inputUrl);
            if (ytId) {
                setPresetYoutubeVideo(ytId);
            } else if (inputUrl.startsWith('http://') || inputUrl.startsWith('https://')) {
                playDirectVideoUrl(inputUrl, true);
            } else {
                showToast('Format tautan video tidak dikenali.', true);
            }
        }

        function setPresetYoutubeVideo(videoId) {
            appSettings.videoType = 'youtube';
            appSettings.videoSource = videoId;
            saveSettingsToStorage();

            // Tampilkan player YouTube, sembunyikan video lokal
            const ytWrapper = document.getElementById('ytPlayerWrapper');
            const localVid = document.getElementById('localVideoPlayer');
            localVid.pause();
            localVid.classList.add('hidden');
            ytWrapper.classList.remove('hidden');

            document.getElementById('videoUrlInput').value = `https://www.youtube.com/watch?v=${videoId}`;

            if (isPlayerReady && player) {
                player.loadPlaylist({
                    playlist: [videoId],
                    index: 0
                });
                player.setLoop(true);
                if (isMuted) {
                    player.mute();
                } else {
                    player.unMute();
                }
            }
            showToast('Video YouTube berhasil diperbarui!');
        }

        function playDirectVideoUrl(url, saveToStorage = true) {
            if (saveToStorage) {
                appSettings.videoType = 'direct';
                appSettings.videoSource = url;
                saveSettingsToStorage();
            }

            const ytWrapper = document.getElementById('ytPlayerWrapper');
            const localVid = document.getElementById('localVideoPlayer');

            if (isPlayerReady && player && typeof player.pauseVideo === 'function') {
                player.pauseVideo();
            }

            ytWrapper.classList.add('hidden');
            localVid.classList.remove('hidden');
            localVid.src = url;
            localVid.muted = isMuted;
            localVid.play().catch(() => {
                showToast('Gagal memutar video. Pastikan format didukung browser.', true);
            });

            showToast('Video latar belakang berhasil diputar!');
        }

        function handleLocalVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('video/')) {
                showToast('Harap pilih file video (MP4, WebM, OGG).', true);
                return;
            }

            if (currentLocalObjectUrl) {
                URL.revokeObjectURL(currentLocalObjectUrl);
            }

            currentLocalObjectUrl = URL.createObjectURL(file);
            // File lokal sementara (blob URL) tidak disimpan permanen ke localStorage karena batasan browser
            playDirectVideoUrl(currentLocalObjectUrl, false);
        }

        function toggleVideoMute() {
            isMuted = !isMuted;
            const iconMuted = document.getElementById('iconMuted');
            const iconUnmuted = document.getElementById('iconUnmuted');
            const localVid = document.getElementById('localVideoPlayer');

            if (isMuted) {
                if (isPlayerReady && player) player.mute();
                localVid.muted = true;
                iconMuted.classList.remove('hidden');
                iconUnmuted.classList.add('hidden');
                showToast('Suara video dimatikan (Mute)');
            } else {
                if (isPlayerReady && player) {
                    player.unMute();
                    player.setVolume(80);
                }
                localVid.muted = false;
                localVid.volume = 0.8;
                iconMuted.classList.add('hidden');
                iconUnmuted.classList.remove('hidden');
                showToast('Suara video diaktifkan');
            }
        }

        /**
         * 4. PENGELOLAAN LOGO PROFIL & TEKS
         */
        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('Harap pilih file gambar (JPG, PNG, WEBP).', true);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const dataUrl = e.target.result;
                appSettings.logoUrl = dataUrl;
                document.getElementById('profileLogoImg').src = dataUrl;
                saveSettingsToStorage();
                showToast('Logo profil berhasil diganti!');
            };
            reader.readAsDataURL(file);
        }

        function applyLogoUrl() {
            const url = document.getElementById('logoUrlInput').value.trim();
            if (!url) {
                showToast('Masukkan URL gambar terlebih dahulu.', true);
                return;
            }
            appSettings.logoUrl = url;
            document.getElementById('profileLogoImg').src = url;
            saveSettingsToStorage();
            showToast('Logo profil dari URL diterapkan!');
        }

        function setLogoShape(shapeClass) {
            appSettings.logoShape = shapeClass;
            const ring = document.getElementById('profileRing');
            const img = document.getElementById('profileLogoImg');

            ring.classList.remove('rounded-full', 'rounded-2xl');
            img.classList.remove('rounded-full', 'rounded-2xl');

            ring.classList.add(shapeClass);
            img.classList.add(shapeClass);
            saveSettingsToStorage();
        }

        function updateProfileText() {
            const nameVal = document.getElementById('profileNameInput').value;
            const subVal = document.getElementById('profileSubtitleInput').value;

            appSettings.profileName = nameVal;
            appSettings.profileSubtitle = subVal;

            document.getElementById('profileNameDisplay').textContent = nameVal || ' ';
            document.getElementById('profileSubtitleDisplay').textContent = subVal || ' ';
            saveSettingsToStorage();
        }

        /**
         * 5. KUSTOMISASI WARNA & OVERLAY
         */
        function setAccentColor(hexColor) {
            appSettings.accentColor = hexColor;
            document.documentElement.style.setProperty('--accent-color', hexColor);
            document.getElementById('profileRing').style.background = `linear-gradient(135deg, ${hexColor}, #818cf8)`;
            saveSettingsToStorage();
        }

        function updateOverlayOpacity(val) {
            appSettings.overlayOpacity = val;
            document.getElementById('overlayValueLabel').textContent = `${val}%`;
            document.getElementById('videoOverlay').style.backgroundColor = `rgba(2, 6, 23, ${val / 100})`;
            saveSettingsToStorage();
        }

        /**
         * 6. PENYIMPANAN LOKAL (LOCALSTORAGE) & UI HELPER
         */
        function saveSettingsToStorage() {
            try {
                localStorage.setItem('yt_digital_clock_settings_v2', JSON.stringify(appSettings));
            } catch (e) {
                console.warn('Gagal menyimpan ke localStorage:', e);
            }
        }

        function loadSettingsFromStorage() {
            try {
                const saved = localStorage.getItem('yt_digital_clock_settings_v2');
                if (saved) {
                    appSettings = { ...DEFAULT_SETTINGS, ...JSON.parse(saved) };
                }
            } catch (e) {
                console.error('Gagal memuat pengaturan:', e);
            }
        }

        function applySettingsToUI() {
            document.getElementById('profileLogoImg').src = appSettings.logoUrl;
            setLogoShape(appSettings.logoShape);

            document.getElementById('profileNameDisplay').textContent = appSettings.profileName;
            document.getElementById('profileSubtitleDisplay').textContent = appSettings.profileSubtitle;

            document.getElementById('profileNameInput').value = appSettings.profileName;
            document.getElementById('profileSubtitleInput').value = appSettings.profileSubtitle;

            if (appSettings.videoType === 'youtube') {
                document.getElementById('videoUrlInput').value = `https://www.youtube.com/watch?v=${appSettings.videoSource}`;
            } else {
                document.getElementById('videoUrlInput').value = appSettings.videoSource;
                playDirectVideoUrl(appSettings.videoSource, false);
            }

            setAccentColor(appSettings.accentColor);
            document.getElementById('overlayOpacitySlider').value = appSettings.overlayOpacity;
            updateOverlayOpacity(appSettings.overlayOpacity);
        }

        function resetSettings() {
            localStorage.removeItem('yt_digital_clock_settings_v2');
            appSettings = { ...DEFAULT_SETTINGS };
            applySettingsToUI();
            setPresetYoutubeVideo(DEFAULT_SETTINGS.videoSource);
            showToast('Pengaturan dikembalikan ke awal.');
        }

        function toggleSettings(open) {
            const drawer = document.getElementById('settingsDrawer');
            if (open) {
                drawer.classList.remove('translate-x-full');
            } else {
                drawer.classList.add('translate-x-full');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        let toastTimeout;
        function showToast(message, isError = false) {
            const toast = document.getElementById('toastNotification');
            const msgEl = document.getElementById('toastMessage');
            const dot = toast.querySelector('span');

            msgEl.textContent = message;
            dot.className = `w-2 h-2 rounded-full ${isError ? 'bg-rose-400' : 'bg-emerald-400'}`;

            toast.classList.remove('opacity-0', '-translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-2');
            }, 3000);
        }
    </script>
</body>
</html>
